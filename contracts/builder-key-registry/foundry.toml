[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# The deploy script reads the initial builder list from this directory.
fs_permissions = [{ access = "read", path = "./script/input" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

# Named RPC endpoints: `forge script ... --rpc-url bsc_testnet` reads the env var at run time.
[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
bsc_mainnet = "${BSC_MAINNET_RPC_URL}"

# Used by `forge verify-contract` / `--verify`.
[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }
bsc_mainnet = { key = "${BSCSCAN_API_KEY}", chain = 56 }
